# Generate Cadenza.xcodeproj with XcodeGen:  brew install xcodegen && xcodegen
name: Cadenza
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cadenza:
    type: application
    platform: iOS
    sources:
      - path: Cadenza
    info:
      path: Cadenza/Info.plist
      properties:
        CFBundleDisplayName: Cadenza
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Cadenza listens to your piano so it can tell which notes you play.
        NSBluetoothAlwaysUsageDescription: Cadenza uses Bluetooth to connect to wireless MIDI keyboards.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cadenza
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  CadenzaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CadenzaTests
    dependencies:
      - target: Cadenza
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cadenza:
    build:
      targets:
        Cadenza: all
        CadenzaTests: [test]
    test:
      targets:
        - CadenzaTests
